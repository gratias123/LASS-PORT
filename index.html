      (function() {
        // Handle Vite HMR websocket in AI Studio sandbox where HMR is disabled
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) {
              isViteHmr = true;
            } else if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) {
              isViteHmr = true;
            } else if (typeof url === 'string' && url.indexOf('token=') !== -1 && url.indexOf('ws') === 0) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var listeners = {};
              var mockWs = {
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(event, cb) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { cb({ type: 'open' }); } catch (err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                },
                dispatchEvent: function() { return true; }
              };
              return mockWs;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress [vite] benign notices from console output
        var filterViteMsg = function(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            if (typeof item === 'string' && (item.indexOf('[vite]') !== -1 || item.indexOf('vite-hmr') !== -1)) {
              return true;
            }
            if (item && item.message && typeof item.message === 'string' && (item.message.indexOf('[vite]') !== -1 || item.message.indexOf('vite-hmr') !== -1)) {
              return true;
            }
          }
          return false;
        };

        var wrapConsole = function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            if (filterViteMsg(arguments)) return;
            return orig.apply(console, arguments);
          };
        };

        wrapConsole('error');
        wrapConsole('warn');
        wrapConsole('info');
        wrapConsole('debug');
        wrapConsole('log');

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) {
            var msg = String(e.reason.message || e.reason || '');
            if (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1) {
              e.preventDefault();
              e.stopPropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('[vite]') !== -1 || e.message.indexOf('WebSocket') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
